openapi: 3.0.0
info:
  version: 19.1.0
  title: Xero Account Data API (Beta)
  description: |
    **Beta:** this API is in beta. Endpoints, request parameters and response shapes may change before general availability.

    The Account Data API provides read access to general ledger account data for a Xero organisation: account balances as at a date, account movements over a date range, and the individual account transactions behind them.
  termsOfService: https://developer.xero.com/xero-developer-platform-terms-conditions/
  contact:
    name: Xero Platform Team
    email: api@xero.com
    url: https://developer.xero.com
  license:
    name: MIT
    url: https://github.com/XeroAPI/Xero-OpenAPI/blob/master/LICENSE
servers:
  - description: Xero Account Data API base url
    url: https://api.xero.com/accountdata.xro/1.0
paths:
  /account-balances:
    get:
      tags:
        - AccountData
      operationId: getAccountBalances
      summary: Get the balance of each general ledger account as at a given date
      description: |
        Retrieves account balances as at `date`, optionally including balances for one or
        more prior comparison periods, and optionally filtered by account class, type,
        account IDs, system account code, or tracking item.

        ### Filtering

        - Filter by `class`, `type`, `accountIds`, and/or `systemAccountCodes`. These can be
          combined freely — when more than one is supplied, the server returns only accounts
          that match **all** of the supplied filters (an intersection, not a union).
        - `type` values are matched case-sensitively, so use uppercase (for example `BANK`). Inventory
          asset accounts are reported as, and can only be filtered by, `INVENTORY`; filtering by
          their underlying account type does not match them.
        - `trackingItemIds` and `unassignedToTrackingCategoryIds` can be used independently of
          the filters above to further narrow which accounts are returned.

        ### Comparison periods

        - Supplying `comparisonPeriodCount` together with `comparisonPeriodSize` returns
          additional balances at prior points in time, in addition to the balance at `date`.
        - The n-th comparison date is `date` shifted back n times `comparisonPeriodSize`. For `MONTH`,
          `QUARTER`, and `YEAR` sizes, a `date` that falls on the last day of its month keeps landing
          on the last day of the shifted month (so comparisons across February behave correctly).
        - `comparisonPeriodCount` and `comparisonPeriodSize` must be supplied together.

        ### Bank accounts

        Bank account data is only available to users with bank account view permission for the
        organisation.

        - If the request would include bank accounts and the user lacks this permission, it is
          rejected with `403 Forbidden`. A request is treated as including bank accounts when it
          has no account filters, filters by all five `class` values and nothing else, includes
          `BANK` in `type`, or lists a bank account in `accountIds`.
        - For other requests (for example `class=ASSET`), bank accounts are silently excluded from
          the response for users without this permission, instead of the request being rejected.

        ### Results

        Only accounts with a non-zero balance at a given date are returned; accounts and comparison
        dates with a net-zero balance are omitted, so the response can be empty.

        ### Pagination

        This endpoint does not paginate — all matching account balances are returned in a single
        response.
      parameters:
        - name: accountingBasis
          in: query
          required: true
          description: Accounting basis for the balance calculation.
          schema:
            type: string
            enum:
              - ACCRUAL
              - CASH
          example: ACCRUAL
        - name: date
          in: query
          required: true
          description: |
            The date to calculate account balances as at, in ISO 8601 format (YYYY-MM-DD).
          schema:
            type: string
            format: date
          example: '2024-12-31'
        - name: comparisonPeriodCount
          in: query
          required: false
          description: |
            Number of additional comparison balances to return, each one further back in
            time than the last. Must be supplied together with `comparisonPeriodSize`.

            - **Minimum**: 1
            - **Maximum**: 100
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
          example: 3
        - name: comparisonPeriodSize
          in: query
          required: false
          description: |
            The unit of time each comparison period steps back by. Must be supplied
            together with `comparisonPeriodCount`.
          schema:
            type: string
            enum:
              - DAY
              - WEEK
              - MONTH
              - QUARTER
              - YEAR
          example: MONTH
        - name: accountIds
          in: query
          required: false
          description: |
            Filter to specific account IDs (GUIDs). Repeat the parameter for multiple
            accounts.

            - **Maximum**: 50 account IDs
            - **Validation**: Returns 404 if any ID does not exist for the organisation
          schema:
            type: array
            items:
              type: string
              format: uuid
            maxItems: 50
          style: form
          explode: true
        - name: class
          in: query
          required: false
          description: Account classes to filter by. Can be combined with other filters.
          schema:
            type: array
            items:
              type: string
              enum:
                - ASSET
                - LIABILITY
                - EQUITY
                - REVENUE
                - EXPENSE
          style: form
          explode: true
        - name: type
          in: query
          required: false
          description: |
            Account types to filter by (e.g. `BANK`, `CURRENT`, etc). Use `INVENTORY` to
            match inventory asset accounts, regardless of their underlying account type.
            Can be combined with other filters.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: systemAccountCodes
          in: query
          required: false
          description: |
            System account codes to filter by (e.g. `RETAINEDEARNINGS`,
            `UNREALISEDGAINS`). Can be combined with other filters.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: trackingItemIds
          in: query
          required: false
          description: Filter to accounts assigned to any of the given tracking item IDs.
          schema:
            type: array
            items:
              type: string
              format: uuid
          style: form
          explode: true
        - name: unassignedToTrackingCategoryIds
          in: query
          required: false
          description: |
            Filter to accounts that are not assigned to any tracking option within the
            given tracking category IDs.
          schema:
            type: array
            items:
              type: string
              format: uuid
          style: form
          explode: true
        - $ref: '#/components/parameters/XeroTenantId'
      responses:
        '200':
          description: Success - returns account balances as at `date`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBalancesResponse'
              example:
                accountBalances:
                  - accountId: 88ed287a-d039-4dca-b3e9-b5f7b125e39b
                    date: '2024-12-31'
                    balance:
                      value: 5230.0
                      type: DEBIT
                    signedBalance: 5230.0
                    account:
                      code: '630'
                      name: Inventory
                      class: ASSET
                      type: INVENTORY
                      status: ACTIVE
                      systemAccountCode: NONE
        '400':
          description: |
            **Bad Request** - The request failed validation. The body is a `ValidationProblem` with a
            `fieldValidationErrors` array.

            Common causes:
            - A required parameter (`accountingBasis`, `date`) is missing, or a value is not a valid date or enum value
            - `comparisonPeriodCount` supplied without `comparisonPeriodSize` (or vice versa)
            - `comparisonPeriodCount` outside the 1-100 range
            - More than 50 `accountIds` specified
            - An empty value in `type` or `systemAccountCodes`
            - The organisation is not active
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              examples:
                missingPair:
                  summary: comparisonPeriodCount without comparisonPeriodSize
                  value:
                    fieldValidationErrors:
                      - fieldName: ''
                        detail: '''comparisonPeriodCount'' and ''comparisonPeriodSize'' must be provided
                          together.'
                    title: Invalid Request
                    status: 400
                    detail: "Validation errors:\r\n'comparisonPeriodCount' and 'comparisonPeriodSize'\
                      \ must be provided together.\r\n"
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          description: |
            **Forbidden** - Returned by the gateway when `Xero-Tenant-Id` is missing, or the token is not authorised for that organisation (a `GatewayProblem` body).

            The service also returns `403` with no response body when the user's role does not allow reading account balances, or when the request would include bank accounts and the user lacks bank account view permission (see Bank accounts above).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayProblem'
              example:
                Type: null
                Title: Forbidden
                Status: 403
                Detail: AuthenticationUnsuccessful
                Instance: 07b4c7cd-b60d-4d8b-bd03-96a1244d1d3d
                Extensions: {}
        '404':
          description: |
            **Not Found** - One or more requested `accountIds` or `systemAccountCodes` do not exist for this organisation, or the organisation was not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                title: Not found
                status: 404
                detail: Account not found.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - OAuth2:
            - accountdata.balances.read
  /account-movements:
    get:
      tags:
        - AccountData
      operationId: getAccountMovements
      summary: Get the net movement of each general ledger account over a date range
      description: |
        Retrieves account movements between `startDate` and `endDate`, optionally
        including movements for one or more prior comparison periods of the same length,
        and optionally filtered by account class, type, account IDs, system account code,
        or tracking item.

        ### Filtering

        - Filter by `class`, `type`, `accountIds`, and/or `systemAccountCodes`. These can be
          combined freely — when more than one is supplied, the server returns only accounts
          that match **all** of the supplied filters (an intersection, not a union).
        - `type` values are matched case-sensitively, so use uppercase (for example `BANK`). Inventory
          asset accounts are reported as, and can only be filtered by, `INVENTORY`; filtering by
          their underlying account type does not match them.
        - `trackingItemIds` and `unassignedToTrackingCategoryIds` can be used independently of
          the filters above to further narrow which accounts are returned.

        ### Comparison periods

        - Supplying `comparisonPeriodCount` together with `comparisonPeriodSize` returns
          additional movements for prior date ranges of the same length, in addition to the
          movement between `startDate` and `endDate`.
        - Each comparison range is calculated by moving the primary range back by
          `comparisonPeriodSize`, `comparisonPeriodCount` times. For `MONTH`, `QUARTER`, and
          `YEAR` sizes, range boundaries that fall on the last day of a month keep landing on
          the last day of the shifted month.
        - `comparisonPeriodCount` and `comparisonPeriodSize` must be supplied together.
        - The primary range and every comparison range must not overlap each other. A request
          whose periods would overlap is rejected with `400 Bad Request`. Ranges that share a single boundary day count as
          overlapping, which month-end adjustment can cause when shifting by `MONTH`, `QUARTER`, or
          `YEAR`.

        ### Bank accounts

        Bank account data is only available to users with bank account view permission for the
        organisation.

        - If the request would include bank accounts and the user lacks this permission, it is
          rejected with `403 Forbidden`. A request is treated as including bank accounts when it
          has no account filters, filters by all five `class` values and nothing else, includes
          `BANK` in `type`, or lists a bank account in `accountIds`.
        - For other requests (for example `class=ASSET`), bank accounts are silently excluded from
          the response for users without this permission, instead of the request being rejected.

        ### Pagination

        This endpoint does not paginate — the full set of matching account movements is
        returned in a single response.

        ### Results

        Only combinations of account and date range with non-zero movement are returned; comparison
        ranges are not zero-filled. The response is a flat list with no guaranteed ordering.
      parameters:
        - name: accountingBasis
          in: query
          required: true
          description: Accounting basis for the movement calculation.
          schema:
            type: string
            enum:
              - ACCRUAL
              - CASH
          example: ACCRUAL
        - name: startDate
          in: query
          required: true
          description: Start date of the movement range, in ISO 8601 format (YYYY-MM-DD).
          schema:
            type: string
            format: date
          example: '2024-01-01'
        - name: endDate
          in: query
          required: true
          description: End date of the movement range, in ISO 8601 format (YYYY-MM-DD).
          schema:
            type: string
            format: date
          example: '2024-12-31'
        - name: comparisonPeriodCount
          in: query
          required: false
          description: |
            Number of additional comparison movements to return, each covering a range
            further back in time than the last. Must be supplied together with
            `comparisonPeriodSize`.

            - **Minimum**: 1
            - **Maximum**: 100
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
          example: 3
        - name: comparisonPeriodSize
          in: query
          required: false
          description: |
            The unit of time each comparison range steps back by. Must be supplied
            together with `comparisonPeriodCount`.
          schema:
            type: string
            enum:
              - DAY
              - WEEK
              - MONTH
              - QUARTER
              - YEAR
          example: MONTH
        - name: accountIds
          in: query
          required: false
          description: |
            Filter to specific account IDs (GUIDs). Repeat the parameter for multiple
            accounts.

            - **Maximum**: 50 account IDs
            - **Validation**: Returns 404 if any ID does not exist for the organisation
          schema:
            type: array
            items:
              type: string
              format: uuid
            maxItems: 50
          style: form
          explode: true
        - name: class
          in: query
          required: false
          description: Account classes to filter by. Can be combined with other filters.
          schema:
            type: array
            items:
              type: string
              enum:
                - ASSET
                - LIABILITY
                - EQUITY
                - REVENUE
                - EXPENSE
          style: form
          explode: true
        - name: type
          in: query
          required: false
          description: |
            Account types to filter by (e.g. `BANK`, `CURRENT`, etc). Use `INVENTORY` to
            match inventory asset accounts, regardless of their underlying account type.
            Can be combined with other filters.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: systemAccountCodes
          in: query
          required: false
          description: |
            System account codes to filter by (e.g. `RETAINEDEARNINGS`,
            `UNREALISEDGAINS`). Can be combined with other filters.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: trackingItemIds
          in: query
          required: false
          description: Filter to accounts assigned to any of the given tracking item IDs.
          schema:
            type: array
            items:
              type: string
              format: uuid
          style: form
          explode: true
        - name: unassignedToTrackingCategoryIds
          in: query
          required: false
          description: |
            Filter to accounts that are not assigned to any tracking option within the
            given tracking category IDs.
          schema:
            type: array
            items:
              type: string
              format: uuid
          style: form
          explode: true
        - $ref: '#/components/parameters/XeroTenantId'
      responses:
        '200':
          description: Success - returns account movements for the requested range(s).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMovementsResponse'
              example:
                accountMovements:
                  - accountId: 88ed287a-d039-4dca-b3e9-b5f7b125e39b
                    dateRange:
                      startDate: '2024-01-01'
                      endDate: '2024-12-31'
                    debits: 1200.0
                    credits: 300.0
                    movement:
                      value: 900.0
                      type: DEBIT
                    signedMovement: 900.0
                    taxDebits: 120.0
                    taxCredits: 30.0
                    signedTaxMovement: 90.0
                    account:
                      code: '630'
                      name: Inventory
                      class: ASSET
                      type: INVENTORY
                      status: ACTIVE
                      systemAccountCode: NONE
        '400':
          description: |
            **Bad Request** - The request failed validation. The body is a `ValidationProblem` with a
            `fieldValidationErrors` array.

            Common causes:
            - A required parameter (`accountingBasis`, `startDate`, `endDate`) is missing, or a value is not a valid date or enum value
            - `comparisonPeriodCount` supplied without `comparisonPeriodSize` (or vice versa)
            - `comparisonPeriodCount` outside the 1-100 range
            - The primary range and one or more comparison ranges overlap
            - `startDate` after `endDate`
            - More than 50 `accountIds` specified
            - An empty value in `type` or `systemAccountCodes`
            - The organisation is not active
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              examples:
                overlappingPeriods:
                  summary: Overlapping comparison periods
                  value:
                    fieldValidationErrors:
                      - fieldName: ''
                        detail: The requested comparison periods overlap. Adjust the date range, 'comparisonPeriodSize',
                          or 'comparisonPeriodCount' so the periods do not overlap.
                    title: Invalid Request
                    status: 400
                    detail: "Validation errors:\r\nThe requested comparison periods overlap. Adjust the\
                      \ date range, 'comparisonPeriodSize', or 'comparisonPeriodCount' so the periods\
                      \ do not overlap.\r\n"
                missingPair:
                  summary: comparisonPeriodCount without comparisonPeriodSize
                  value:
                    fieldValidationErrors:
                      - fieldName: ''
                        detail: '''comparisonPeriodCount'' and ''comparisonPeriodSize'' must be provided
                          together.'
                    title: Invalid Request
                    status: 400
                    detail: "Validation errors:\r\n'comparisonPeriodCount' and 'comparisonPeriodSize'\
                      \ must be provided together.\r\n"
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          description: |
            **Forbidden** - Returned by the gateway when `Xero-Tenant-Id` is missing, or the token is not authorised for that organisation (a `GatewayProblem` body).

            The service also returns `403` with no response body when the user's role does not allow reading account movements, or when the request would include bank accounts and the user lacks bank account view permission (see Bank accounts above).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayProblem'
              example:
                Type: null
                Title: Forbidden
                Status: 403
                Detail: AuthenticationUnsuccessful
                Instance: 07b4c7cd-b60d-4d8b-bd03-96a1244d1d3d
                Extensions: {}
        '404':
          description: |
            **Not Found** - One or more requested `accountIds` or `systemAccountCodes` do not exist for this organisation, or the organisation was not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                title: Not found
                status: 404
                detail: Account not found.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - OAuth2:
            - accountdata.movements.read
  /account-transactions:
    get:
      tags:
        - AccountData
      operationId: getAccountTransactions
      summary: Get general ledger account transactions between two dates, with pagination and filtering
      description: |
        Retrieves transactions posted between `startDate` and `endDate` (inclusive),
        optionally filtered by account IDs, class, type, or system account code, with
        cursor-based pagination for large result sets.

        **First call:** omit `token`. Supply `accountingBasis`, `startDate`, and
        `endDate` (all required), plus any optional filters.

        **Continuation calls:** supply only `token`, taken from the previous response's
        `pagination.nextToken`. Do not send any other query parameters — they are
        ignored if present, since the original request is captured by the token.

        ### Pagination

        - Results are returned in pages of 200 lines.
        - Use `pagination.nextToken` from the response as the `token` query parameter to fetch
          the next page. Send only the `token` query parameter on continuation requests — all
          other query parameters are
          ignored on a continuation call, since the original request's parameters are already
          captured by the token.
        - The `token` value is an opaque string. Treat it as an opaque string only — do not
          parse, modify, or construct it yourself. Tokens may expire.
        - When `pagination` is `null`, you've reached the last page.
        - The API captures a consistent snapshot at the time of the first request (via
          `maxJournalNumber`), so transactions added while you are paginating through a
          result set won't appear partway through, and won't cause duplicates or gaps.

        ### Filtering

        - Filter by `accountIds`, `class`, `type`, and/or `systemAccountCodes`. These can be
          combined freely — when more than one is supplied, the server returns only
          transactions for accounts that match **all** of the supplied filters (an
          intersection, not a union).
        - `type` values are matched case-sensitively, so use uppercase (for example `BANK`). Inventory
          asset accounts are reported as, and can only be filtered by, `INVENTORY`; filtering by
          their underlying account type does not match them.
        - Use `systemAccountCodes=NONE` to match accounts that have no system account code.
        - Filters are only read from the first request in a pagination sequence — see
          Pagination above.

        ### Bank accounts

        Bank account transactions are only available to users with bank account view permission for
        the organisation.

        - If the user lacks this permission and the request includes `BANK` in `type`, or lists a
          bank account in `accountIds`, it is rejected with `403 Forbidden`.
        - For all other requests, including unfiltered requests, bank account transactions are
          silently excluded from the results for users without this permission.
      parameters:
        - name: accountingBasis
          in: query
          required: false
          description: |
            Accounting basis for the transaction query. Required on the first call;
            not used (and ignored) on continuation calls made with `token`.
          schema:
            type: string
            enum:
              - ACCRUAL
              - CASH
          example: ACCRUAL
        - name: startDate
          in: query
          required: false
          description: |
            Start date in ISO 8601 format (YYYY-MM-DD). Required on the first call; not
            used (and ignored) on continuation calls made with `token`.
          schema:
            type: string
            format: date
          example: '2024-01-01'
        - name: endDate
          in: query
          required: false
          description: |
            End date in ISO 8601 format (YYYY-MM-DD). Required on the first call; not
            used (and ignored) on continuation calls made with `token`.
          schema:
            type: string
            format: date
          example: '2024-12-31'
        - name: accountIds
          in: query
          required: false
          description: |
            Filter to specific account IDs (GUIDs). Repeat the parameter for multiple
            accounts. Only used on the first call.

            - **Maximum**: 20 account IDs
            - **Validation**: Returns 404 if any ID does not exist for the organisation
          schema:
            type: array
            items:
              type: string
              format: uuid
            maxItems: 20
            minItems: 1
          style: form
          explode: true
        - name: class
          in: query
          required: false
          description: |
            Account classes to filter by. Can be combined with other filters. Only used
            on the first call.
          schema:
            type: array
            items:
              type: string
              enum:
                - ASSET
                - LIABILITY
                - EQUITY
                - REVENUE
                - EXPENSE
          style: form
          explode: true
        - name: type
          in: query
          required: false
          description: |
            Account types to filter by (e.g. `BANK`, `CURRENT`, etc). Use `INVENTORY` to
            match inventory asset accounts, regardless of their underlying account type.
            Can be combined with other filters. Only used on the first call.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: systemAccountCodes
          in: query
          required: false
          description: |
            System account codes to filter by (e.g. `RETAINEDEARNINGS`,
            `UNREALISEDGAINS`). Use `NONE` to match accounts with no system account code.
            Can be combined with other filters. Only used on the first call.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: include
          in: query
          required: false
          description: |
            Additional data to include in the response. Only used on the first call.
          schema:
            type: array
            items:
              type: string
              enum:
                - trackingCategories
          style: form
          explode: true
          example:
            - trackingCategories
        - name: maxJournalNumber
          in: query
          required: false
          description: |
            Maximum journal number to include in results, for point-in-time queries. If
            omitted, the server captures the current maximum journal number at the time
            of the first request and reuses it for every subsequent page, so the whole
            paginated result set is consistent as at the moment you started. Only used on
            the first call.
          schema:
            type: integer
            format: int64
            minimum: 0
          example: 999999
        - name: token
          in: query
          required: false
          description: |
            Continuation token from a previous response's `pagination.nextToken`. When
            present, all other query parameters are ignored. Opaque — do not parse,
            modify, or construct it.
          schema:
            type: string
        - $ref: '#/components/parameters/XeroTenantId'
      responses:
        '200':
          description: |
            Success - returns account transactions with pagination.

            - `lines`: transaction lines for this page (max 200)
            - `pagination.nextToken`: token for the next page (`pagination` is `null` on the last page)
            - `currencyCode`: organisation's base currency
            - `maxJournalNumber`: the snapshot boundary used for pagination consistency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTransactionsResponse'
              examples:
                firstPage:
                  summary: First page with more data available
                  value:
                    currencyCode: USD
                    maxJournalNumber: 546
                    lines:
                      - journalNumber: 546
                        journalDate: '2024-12-31'
                        description: Inventory Opening Balance
                        account:
                          id: 88ed287a-d039-4dca-b3e9-b5f7b125e39b
                          code: '630'
                          name: Inventory
                          class: ASSET
                          type: INVENTORY
                          status: ACTIVE
                          systemAccountCode: NONE
                        netAmount:
                          value: 80.0
                          type: CREDIT
                        signedNetAmount: -80.0
                        taxAmount:
                          value: 0.0
                          type: CREDIT
                        signedTaxAmount: 0.0
                        source:
